name: 🏭 Create 128mb Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - 128mb-build

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      # Docs - https://github.com/mathieudutour/github-tag-action
      # Workflows cannot trigger other workflows implicitly
      # - https://github.community/t/github-actions-workflow-not-triggering-with-tag-push/17053/7
      - name: Bump Version and Push Tag
        if: github.repository == 'xTVaser/pcsx2-rr'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ secrets.BOT_PAT }}
          release_branches: 128mb-build
          tag_prefix: 128mb/v
          default_bump: ${{ github.event.inputs.bump }}

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}
        run: gh release create ${{ steps.tag_version.outputs.new_tag }} --generate-notes --draft --repo xTVaser/pcsx2-rr --title "128MB Build - ${{ steps.tag_version.outputs.new_tag }}"
